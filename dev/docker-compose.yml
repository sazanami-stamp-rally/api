services:
  postgres:
    image: postgres:15
    container_name: postgres_debug
    environment:
      POSTGRES_USER: sazanami
      POSTGRES_PASSWORD: sazanami
      POSTGRES_DB: sazanami
    ports:
      - "5432:5432"
    volumes:
      - stamp-rally_db:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin4_debug
    environment:
      PGADMIN_DEFAULT_EMAIL: sazanami@example.com
      PGADMIN_DEFAULT_PASSWORD: sazanami
    ports:
      - "5050:80"
    volumes:
      - stamp-rally_pgadmin4:/var/lib/pgadmin
    depends_on:
      - postgres

volumes:
  stamp-rally_pgadmin4:
  stamp-rally_db:
